name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

env:
  NODE_VERSION: '22'
  AWS_REGION: us-east-1

# ════════════════════════════════════════════════
# Pipeline flow:
#
#   PR (dev → main):    lint + test → build → deploy-dev
#   Push to main:       lint + test → build → release → deploy-prod
#
# ════════════════════════════════════════════════

jobs:
  # ──────────────────────────────────────────────
  # Lint all workspaces
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend run lint
      - run: pnpm --filter frontend run lint
      - run: pnpm --filter infra run lint

  # ──────────────────────────────────────────────
  # Test all workspaces with coverage
  # ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Backend tests (95% coverage)
        run: pnpm --filter backend run test:coverage
      - name: Frontend tests
        run: pnpm --filter frontend run test || true
      - name: Infra tests
        run: pnpm --filter infra run test

  # ──────────────────────────────────────────────
  # Build + CDK synth
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend run build
      - run: pnpm --filter frontend run build
      - name: CDK synth (dev)
        if: github.event_name == 'pull_request'
        run: pnpm --filter infra run synth -- -c stageName=dev
      - name: CDK synth (prod)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter infra run synth -- -c stageName=prod

  # ──────────────────────────────────────────────
  # Deploy DEV (PR from dev → main)
  # ──────────────────────────────────────────────
  deploy-dev:
    name: Deploy Dev
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' && github.head_ref == 'dev'
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ── Assume AWS role ──
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build backend
        run: pnpm --filter backend run build

      # ── Deploy infra first (creates all AWS resources) ──
      - name: Deploy CDK stacks
        run: >
          pnpm --filter infra run deploy --
          -c stageName=dev
          -c googleClientId=${{ secrets.GOOGLE_CLIENT_ID }}
          -c googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}
          --require-approval never

      # ── Fetch CDK outputs (Cognito IDs, table name, etc.) ──
      - name: Fetch stack outputs
        id: outputs
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$1" \
              --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" \
              --output text
          }
          echo "USER_POOL_ID=$(get_output TeamManager-Auth-dev UserPoolId)" >> $GITHUB_OUTPUT
          echo "USER_POOL_CLIENT_ID=$(get_output TeamManager-Auth-dev UserPoolClientId)" >> $GITHUB_OUTPUT
          echo "COGNITO_DOMAIN=$(get_output TeamManager-Auth-dev UserPoolDomain)" >> $GITHUB_OUTPUT

      # ── Build frontend with CDK outputs injected ──
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_USER_POOL_ID: ${{ steps.outputs.outputs.USER_POOL_ID }}
          NEXT_PUBLIC_USER_POOL_CLIENT_ID: ${{ steps.outputs.outputs.USER_POOL_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ steps.outputs.outputs.COGNITO_DOMAIN }}
          NEXT_PUBLIC_REDIRECT_SIGN_IN: ${{ vars.APP_URL }}
          NEXT_PUBLIC_REDIRECT_SIGN_OUT: ${{ vars.APP_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: pnpm --filter frontend run build

      # ── Deploy frontend to S3 + invalidate CDN ──
      - name: Deploy frontend
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name TeamManager-Frontend-dev \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          aws s3 sync frontend/out/ "s3://${BUCKET}" --delete

          DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name TeamManager-Frontend-dev \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue" \
            --output text)
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?DomainName=='${DOMAIN}'].Id" \
            --output text)
          [ -n "$DIST_ID" ] && aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" --paths "/*"

  # ──────────────────────────────────────────────
  # Semantic Release (push to main)
  # ──────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # ──────────────────────────────────────────────
  # Deploy PROD (after release, on push to main)
  # ──────────────────────────────────────────────
  deploy-prod:
    name: Deploy Prod
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ── Assume AWS role ──
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build backend
        run: pnpm --filter backend run build

      # ── Deploy infra first ──
      - name: Deploy CDK stacks
        run: >
          pnpm --filter infra run deploy --
          -c stageName=prod
          -c googleClientId=${{ secrets.GOOGLE_CLIENT_ID }}
          -c googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}
          --require-approval never

      # ── Fetch CDK outputs ──
      - name: Fetch stack outputs
        id: outputs
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$1" \
              --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" \
              --output text
          }
          echo "USER_POOL_ID=$(get_output TeamManager-Auth-prod UserPoolId)" >> $GITHUB_OUTPUT
          echo "USER_POOL_CLIENT_ID=$(get_output TeamManager-Auth-prod UserPoolClientId)" >> $GITHUB_OUTPUT
          echo "COGNITO_DOMAIN=$(get_output TeamManager-Auth-prod UserPoolDomain)" >> $GITHUB_OUTPUT

      # ── Build frontend with CDK outputs ──
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_USER_POOL_ID: ${{ steps.outputs.outputs.USER_POOL_ID }}
          NEXT_PUBLIC_USER_POOL_CLIENT_ID: ${{ steps.outputs.outputs.USER_POOL_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ steps.outputs.outputs.COGNITO_DOMAIN }}
          NEXT_PUBLIC_REDIRECT_SIGN_IN: ${{ vars.APP_URL }}
          NEXT_PUBLIC_REDIRECT_SIGN_OUT: ${{ vars.APP_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: pnpm --filter frontend run build

      # ── Deploy frontend to S3 + invalidate CDN ──
      - name: Deploy frontend
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name TeamManager-Frontend-prod \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          aws s3 sync frontend/out/ "s3://${BUCKET}" --delete

          DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name TeamManager-Frontend-prod \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue" \
            --output text)
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?DomainName=='${DOMAIN}'].Id" \
            --output text)
          [ -n "$DIST_ID" ] && aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" --paths "/*"
